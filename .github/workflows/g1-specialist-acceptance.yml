name: G1 frozen-head specialist review (NOT release)
on:
  push:
    branches: [cq/hq/g1-specialist-ci]
  pull_request:
    branches: [cq/integration/vertical-slice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fea11e776776c0bb4f6491f8ecd9c2e12871b2c4
          persist-credentials: false
      - name: Record exact Content branch SHA
        run: test "$(git rev-parse HEAD)" = "fea11e776776c0bb4f6491f8ecd9c2e12871b2c4"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema verifier
        run: python -m pip install jsonschema==4.26.0
      - name: Schema and semantic authoring assertions for E01–E03
        run: |
          python src/contracts/verify-v1.py
          python src/content/reports/verify-g1-three.py
      - name: Boundary of verification
        run: echo "Static author checks only — no independent learner semantic appraisal, game scene or Android test."

  engine-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24b970400bdc84d281bd06f148fd566738718197
          persist-credentials: false
      - name: Record exact Engine branch SHA
        run: test "$(git rev-parse HEAD)" = "24b970400bdc84d281bd06f148fd566738718197"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependencies
        run: npm ci --no-audit --fund=false
      - name: Engine real source compile and save/interaction regression tests
        run: node src/core/g1/verify.mjs
      - name: Full strict scene compile
        run: |
          npx tsc --strict --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM src/game/g1/observation-scene.ts src/core/g1/engine-bridge.ts src/adapters/g1/save-state.ts
      - name: Boundary of verification
        run: echo "Unit/TypeScript only — Engine scene not mounted to actual G1 page and no browser playtest."

  ui-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e7f6e645665e7420c7e5f557f7283940d7f5a18
          persist-credentials: false
      - name: Record exact UI branch SHA
        run: test "$(git rev-parse HEAD)" = "4e7f6e645665e7420c7e5f557f7283940d7f5a18"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependencies
        run: npm ci --no-audit --fund=false
      - name: Compile real UI overlay and mock
        run: npx tsc --noEmit -p src/ui/tsconfig.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Independent mobile/desktop UI mock Chromium smoke
        run: node src/ui/mock/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-ui-owned-mock-screenshots
          path: src/ui/mock/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Boundary of verification
        run: echo "UI mock only — not actual mounted Phaser scene and not physical Android."
