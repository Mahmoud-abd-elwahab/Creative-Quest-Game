<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Quest · Isolated Engine Spike</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0e1c2b;color:#fff;font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #d5ff88;outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column}header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#15283a;gap:12px;min-height:65px}header strong{font-size:15px}header small{display:block;font-size:10px;color:#c0d3ce;margin-top:5px}#xp{color:#d8ff93}#view{position:relative;min-height:0;flex:1;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}
#action{position:absolute;bottom:52px;right:16px;border-radius:22px;padding:15px;min-height:64px;min-width:132px;background:#ecdc9e;color:#2b3040;border:2px solid #fff3c0;font-weight:bold}#action:disabled{opacity:.6}#joy{position:absolute;bottom:45px;left:17px;width:112px;height:112px;border-radius:50%;background:#173940bc;border:2px solid #8bddc2;display:grid;place-items:center;touch-action:none;user-select:none}#stick{height:55px;width:55px;background:#c9f8ad;border-radius:50%;box-shadow:0 4px 12px #0007}#tip{position:absolute;top:13px;left:10px;right:10px;padding:9px;border-radius:10px;background:#152e3acc;font-size:12px;text-align:center}#toast{position:absolute;bottom:175px;left:15%;right:15%;padding:10px;border-radius:9px;text-align:center;background:#f1e4a6;color:#223;font-size:12px}#dialog{position:fixed;inset:0;z-index:5;background:#07101ded;display:grid;place-items:center;padding:15px}#dialog[hidden],#toast[hidden]{display:none}#challenge{width:min(560px,100%);max-height:90vh;overflow-y:auto;background:#1d2d45;border:2px solid #85a9a7;border-radius:19px;padding:20px;line-height:1.8}#challenge h2{margin-top:0}#challenge p{font-size:14px}.answers{display:grid;gap:9px}.answers button,.secondary{border-radius:11px;padding:11px;text-align:right;background:#3a4e64;color:#fff;border:1px solid #92a6b6;min-height:48px}.answers button:disabled{opacity:.55}.secondary{background:#c4e9ad;color:#1c3030;margin-top:15px;text-align:center}#feedback{color:#d8ffa5;min-height:20px}footer{background:#142235;padding:5px;text-align:center;font-size:10px;color:#b9c9d0}@media(min-width:800px){#app{max-width:1100px;margin:auto;border-inline:1px solid #37566b}header strong{font-size:19px}}
</style></head><body><div id="app"><header><div><strong>CREATIVE QUEST · ENGINE SPIKE</strong><small id="save-state">Local sandbox · original v0.4 untouched</small></div><div>XP <strong id="xp">0</strong></div></header>
<main id="view"><canvas id="field" aria-label="عالم ملاحظة تجريبي؛ اتحرك بأسهم الكيبورد أو العصاية"></canvas><div id="tip">امشي للحارس المضيء · WASD / الأسهم / المس الخريطة · E للتفاعل</div><div id="joy" aria-label="عصاية تحكم باللمس" role="group"><div id="stick"></div></div><button id="action">قرّب من الحارس</button><div id="toast" role="status" hidden></div></main><footer>ISOLATED POC · PLACEHOLDER ART · NOT PHASER · NOT PRODUCTION</footer></div>
<div id="dialog" hidden><section id="challenge" role="dialog" aria-modal="true" aria-labelledby="challenge-title"></section></div><script type="module" src="./main.js"></script></body></html>
